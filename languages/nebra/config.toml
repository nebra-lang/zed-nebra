name = "Nebra"
grammar = "nebra"
path_suffixes = ["neb"]
line_comments = ["-- "]
block_comment = ["--[[ ", " ]]"]
tab_size = 4
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
]
increase_indent_pattern = "^\\s*(else|elseif|for|function|if|repeat|while|do|class|interface|enum|match|case|module|declare\\s+(class|interface|module|enum))\\b.*$|^\\s*(local\\s+)?(async\\s+)?function\\b.*$|\\{\\s*$|\\(\\s*$"
decrease_indent_pattern = "^\\s*(end|else|elseif|until|\\}|\\))\\s*$"
